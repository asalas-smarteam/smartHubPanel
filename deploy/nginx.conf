server {
  listen 3007;
  server_tokens off;
  root /usr/share/nginx/html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
  }
}
